<!DOCTYPE html>
<html>
<head>
    <title>KV Database</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .container { max-width: 800px; }
        select, textarea { width: 100%; margin: 5px 0; }
        button { padding: 5px 15px; margin: 5px; }
        .flex { display: flex; gap: 10px; align-items: center; }
        #jsonEditor { height: 200px; font-family: monospace; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .button-group { margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="flex">
        <select id="tableList" style="width: 300px;" onchange="loadKeys()"></select>
        <select id="keyList" style="width: 200px;" onchange="loadValue()"></select>
        <div class="flex">
            <button id="nextPage" onclick="nextPage()" title="Next page" disabled>next</button>
            <button onclick="location.reload()">reload</button>
        </div>
    </div>
    <textarea id="jsonEditor" oninput="editorRevision++" disabled></textarea>
    <div class="button-group">
        <button onclick="saveValue()">Save</button>
        <button onclick="deleteKey()">Delete</button>
    </div>
</div>

<script>
    const API = {
        tables: '/Zeze/Builtin/DbWeb/ListTable',
        keys: '/Zeze/Builtin/DbWeb/WalkTable',
        value: '/Zeze/Builtin/DbWeb/GetValue',
        save: '/Zeze/Builtin/DbWeb/PutRecord',
        delete: '/Zeze/Builtin/DbWeb/DeleteRecord'
    };

    let pagination = {
        currentTable: null,
        startKey: '',
        pageSize: 20,
        hasMore: false,
        loading: false
    };

    // 请求代次同时区分 A→B→A；相同表名/键不能证明旧响应仍属于当前选择。
    let keysRequestId = 0;
    let valueRequestId = 0;
    let editorRevision = 0;
    let editorBinding = null;

    function resetEditor() {
        ++valueRequestId;
        editorBinding = null;
        const editor = document.getElementById('jsonEditor');
        editor.value = '';
        editor.disabled = true;
        return valueRequestId;
    }

    function ownsKeys(table, requestId) {
        return requestId === keysRequestId && table === document.getElementById('tableList').value;
    }

    function ownsSelection(binding) {
        return binding && binding.requestId === valueRequestId
            && binding.table === document.getElementById('tableList').value
            && binding.key === document.getElementById('keyList').value;
    }

    function ownsEditor(binding) {
        // 写入前除检查选择外，还要证明编辑内容来自该次成功加载。
        return binding === editorBinding && ownsSelection(binding);
    }

    // URL只提供初始凭据；403后输入的新凭据须替换本页面的当前凭据。
    let accessToken = new URLSearchParams(location.search).get('token')
        || localStorage.getItem('dbweb_token') || '';
    if (accessToken) localStorage.setItem('dbweb_token', accessToken);

    function apiUrl(path, parameters = {}) {
        const query = new URLSearchParams(parameters);
        if (accessToken) query.set('token', accessToken);
        const encoded = query.toString();
        return encoded ? `${path}?${encoded}` : path;
    }

    async function init() {
        try {
            const response = await fetch(apiUrl(API.tables));
            if (response.status === 403) {
                const t = prompt('DbWeb 需要访问 token（服务启动日志中查看）');
                if (t) {
                    accessToken = t;
                    localStorage.setItem('dbweb_token', t);
                    return init();
                }
            }
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const tables = await response.json();
            const select = document.getElementById('tableList');
            tables.forEach(table => select.add(new Option(table, table)));
            // 插入首项会自动选中，但不会触发 change；首次键和值加载须由初始化驱动。
            if (tables.length > 0) await loadKeys();
        } catch (error) {
            alert(`加载表失败: ${error.message}`);
        }
    }
    init();

    async function loadKeys(reset = true) {
        const table = document.getElementById('tableList').value;
        const requestId = ++keysRequestId;
        if (reset) {
            resetEditor();
            document.getElementById('keyList').innerHTML = '';
            pagination.startKey = '';
            pagination.hasMore = false;
        }
        pagination.currentTable = table;
        pagination.loading = false;
        document.getElementById('nextPage').disabled = true;
        if (!table) return;
        pagination.loading = true;
        try {
            const url = apiUrl(API.keys, {t: table, k: pagination.startKey, n: pagination.pageSize});
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const { keys, hasMore } = await response.json();
            if (!ownsKeys(table, requestId)) return;
            pagination.hasMore = hasMore;

            const select = document.getElementById('keyList');
            keys.forEach(key => select.add(new Option(key, key)));
            
            if (reset && keys.length > 0) {
                select.selectedIndex = 0;
                loadValue();
            }
        } catch (error) {
            if (ownsKeys(table, requestId))
                alert(`加载键失败: ${error.message}`);
        } finally {
            if (requestId === keysRequestId) {
                pagination.loading = false;
                document.getElementById('nextPage').disabled = !pagination.hasMore;
            }
        }
    }

    async function nextPage() {
        try {
            if (pagination.loading || !pagination.hasMore) return;
            const select = document.getElementById('keyList');
            if (select.options.length > 0) {
                pagination.startKey = select.options[select.options.length - 1].value;
            }
            await loadKeys(false);
        } catch (error) {
            alert(`翻页失败: ${error.message}`);
        }
    }

    async function loadValue() {
        const table = document.getElementById('tableList').value;
        const select = document.getElementById('keyList');
        const key = select.value;
        const binding = {table, key, requestId: resetEditor()};
        if (!table || select.selectedIndex < 0) return;
        try {
            const url = apiUrl(API.value, {t: table, k: key});
            
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const value = await response.text();
            JSON.parse(value); // 仅验证格式；Java long/decimal 不得经 Number 再序列化而丢精度。
            if (!ownsSelection(binding)) return;
            document.getElementById('jsonEditor').value = value;
            document.getElementById('jsonEditor').disabled = false;
            editorBinding = binding;
        } catch (error) {
            if (ownsSelection(binding))
                alert(`加载值失败: ${error.message}`);
        }
    }

    async function saveValue() {
        const binding = editorBinding;
        const revision = editorRevision;
        try {
            const table = document.getElementById('tableList').value;
            const key = document.getElementById('keyList').value;
            const value = document.getElementById('jsonEditor').value;
            if (!ownsEditor(binding)) {
                alert('请先等待当前记录加载完成');
                return;
            }
            
            try {
                JSON.parse(value);
            } catch {
                throw new Error('无效的JSON格式');
            }
            
            const url = apiUrl(API.save, {t: table, k: key});
            const response = await fetch(url, {
                method: 'Put',
                headers: { 'Content-Type': 'application/json' },
                body: value
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            if (ownsEditor(binding) && revision === editorRevision)
                alert('保存成功');
        } catch (error) {
            if (ownsEditor(binding) && revision === editorRevision)
                alert(`保存失败: ${error.message}`);
        }
    }

    
    async function deleteKey() {
        const binding = editorBinding;
        const revision = editorRevision;
        try {
            const table = document.getElementById('tableList').value;
            const key = document.getElementById('keyList').value;
            if (!ownsEditor(binding)) {
                alert('请先等待当前记录加载完成');
                return;
            }
            if (!table || !key) {
                alert('Please select a table and a key.');
                return;
            }
            
            const confirmed = confirm(`Are you sure you want to delete key "${key}"? This action cannot be undone!`);
            if (!confirmed) return;

            const url = apiUrl(API.delete, {t: table, k: key});
            const response = await fetch(url, { method: 'Delete' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            // 服务器已删除捕获的记录；迟到结果不能清掉新选择或请求期间的新编辑。
            if (!ownsEditor(binding) || revision !== editorRevision) return;

            alert('Key deleted successfully.');
            loadKeys(true); // 重新加载键列表
        } catch (error) {
            if (ownsEditor(binding) && revision === editorRevision)
                alert(`Failed to delete key: ${error.message}`);
        }
    }
</script>
</body>
</html>
