# 多项目并行执行（跨子项目任务级并行，对本仓库单车道测试无影响，多车道同跑时受益）
org.gradle.parallel=true
# 配置缓存：省去每次构建的配置阶段开销（~1-2s/次）。构建脚本改动后自动失效重算，无需手工干预。
org.gradle.configuration-cache=true
# daemon堆：默认512m在MySQL重定向批的bench车道被撑爆（两代OOM堆转储717/719MB同签名，
# daemon死后当轮bench必红）。live set峰值>700m，2g留3x余量；保留dump标志供复发取证。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
