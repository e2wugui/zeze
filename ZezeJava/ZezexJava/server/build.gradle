apply from: '../../ZezeJava/build.gradle'

dependencies {
    implementation project(":ZezeJava")

    implementation 'org.jgrapht:jgrapht-core:1.5.3'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.alibaba:druid:1.2.28'
}

// 8个热模块（solution.xml hot="true"）的实现、接口（I*.java）与生成代码全部归 hot 源集，
// src/ 下不留任何热模块文件，产物不进冷classpath——对齐生产 start.bat 的组成（server.jar 由
// Distribute 排除热模块目录生成，模块类只存在于 hot/modules/*.jar）。这是 HotModule 冷抢载
// fail-fast 守卫（HotModule.java:49）成立的前提。
// 接口身份：冷侧不引用接口（唯一消费者 TestOnline 已改反射——接口 Class 不在测试 classpath，
// 字节码引用运行期解析不到），运行时全部经 HotManager 单一装载器——putJar 把所有
// interface.jar 的 class 条目合并进同一索引，跨包接口引用（IEquip→Item.IItem 等）同装载器
// 解析，无身份分裂；模块实现（HotModule 子装载器）委派上来拿到同一身份。
def hotModuleNames = ['Buf', 'Equip', 'Fight', 'Item', 'Login', 'LongSet', 'Skill', 'Timer']
def hotPackagePatterns = hotModuleNames.collect { "Game/${it}/**" }

// Gen 全量再生成无条件输出热模块包，按包分拣到 build 下两个镜像目录再挂进源集。
// 不能 srcDirs=['src','Gen']+exclude 再把 src/Game/<X> 注册成独立 srcDir 根绕过排除（排除
// 模式按各 srcDir 根分别相对化，Gradle 下可行）：IDEA 会把每个 srcDir 标成源码根，I*.java
// 紧贴根、相对路径为空，报"软件包名称 'Game.X' 与文件路径 '' 不对应"（javac 对显式文件
// 清单无此检查，故 CLI 构建不报）。分拣镜像目录保留完整包路径，两边都不报。
// 骨架复活陷阱已根治：Gen 支持 project 属性 HotSrcDir（双hot 模块主类归热目录，未配置即
// 报错不回退），见 solution.xml 的 HotSrcDir="server/src-hot"。
def genMainDir = layout.buildDirectory.dir('generated/sources/gen-main')
def genHotDir = layout.buildDirectory.dir('generated/sources/gen-hot')
def syncGenMain = tasks.register('syncGenMain', Sync) {
    from 'Gen'
    into genMainDir
    exclude hotPackagePatterns
}
def syncGenHot = tasks.register('syncGenHot', Sync) {
    from 'Gen'
    into genHotDir
    include hotPackagePatterns
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            srcDir syncGenMain
        }
    }
    hot {
        java {
            srcDirs = ['src-hot']
            srcDir syncGenHot
        }
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
    }
}
