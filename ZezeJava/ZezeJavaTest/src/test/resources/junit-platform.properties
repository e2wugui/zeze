# 单个 @Test 方法的默认墙钟超时：超时以 TimeoutException 失败，代替曾经的无限挂起。
# 合法用例实测上限远低于此：Infinite.Simulate 2 万笔跨服事务 ~15s，Zezex 组网/基准 ~20-60s，
# TestTokenKeepAlive ~4.5s；GlobalRaft 混沌演练是 main 手工驱动，不经 JUnit，不受此约束。
junit.jupiter.execution.timeout.default = 300 s

# 并行度上限（r2 波1新增）：JUnit 6 默认按核数（20）动态并行 test class。套件增长到 ~175 类
# （多节点 raft 集群/Netty 服务/Application 实例类测试变多）后，类内定时窗（accept 30s、
# connector WaitReady、raft 选举稳定窗）在满并行下互相饿死，失败组合每轮漂移且全部单跑即绿。
# 固定 8 并发：保留并行收益，留出定时窗余量（20 核机器实测）。
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 8
