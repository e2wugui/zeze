apply from: '../ZezeJava/build.gradle'

// Temp热更demo的模块/接口类：独立源集，产物不进test运行classpath——
// 模块类只允许存在于模块jar中（HotModule冷classpath抢载守卫的前提）。
sourceSets {
    hot {
        java.srcDir 'src-hot'
        compileClasspath += sourceSets.test.output
        compileClasspath += sourceSets.test.compileClasspath
    }
}

dependencies {
    implementation project(":ZezeJava")
    implementation project(":ZezexJava:client")
    implementation project(":ZezexJava:linkd")
    implementation project(":ZezexJava:server")

    // for netty
    implementation 'io.netty:netty-codec-http:4.1.137.Final'
    implementation 'io.netty:netty-codec-http2:4.1.137.Final'
    implementation 'io.netty:netty-transport-native-epoll:4.1.137.Final:linux-x86_64'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'

    // for test (JUnit 6 / Jupiter)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'

    // for TestFnd19D06LogSessionBinding（FND19 GE-D06：ZokerManager 会话绑定回执的纯逻辑直测）
    testImplementation project(":ZokerManager")

    // for BenchPersistentCollectionsCompare（pcollections 替代评估：显式声明以便测试代码直接引用）
    testImplementation 'org.pcollections:pcollections:4.0.2'
    testImplementation 'io.vavr:vavr:0.10.5'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'
    // for BenchTransientSnapshotCompare（可变快照评估：Clojure PersistentHashMap 的 transient）
    testImplementation 'org.clojure:clojure:1.12.0'
    testImplementation 'org.openjdk.jol:jol-core:0.17'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-console:6.1.3'
    // TestEnvLauncherListener（ServiceLoader 注册）编译/运行都需要 launcher api
    testImplementation 'org.junit.platform:junit-platform-launcher:6.1.3'

    // 测试代码直接使用 org.rocksdb（Dbh2、MQ、Benchmark 等）；
    // 运行时的平台 jar（win64/linux64/osx）由 ZezeJava 的 runtimeOnly 传递。
    testCompileOnly 'org.rocksdb:rocksdbjni:10.10.1.1'

    // 测试代码直接使用 com.ecwid.consul（TestNettyConsulRegister 的捕获型 mock；
    // ZezeJava 侧为 compileOnly 可选集成，版本保持一致）
    testImplementation 'com.ecwid.consul:consul-api:1.4.5'

    // for GTable
    //implementation 'com.google.guava:guava:33.4.0-jre'

    // for Json field
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.65'

    // for PrometheusCounter 契约测试（主工程为compileOnly，下游自备）
    implementation 'io.prometheus:prometheus-metrics-core:1.3.10'

    // for tikv
    implementation 'org.tikv:tikv-client-java:3.3.5'

    // for jdbc(mysql,sqlserver,tidb)
    implementation 'com.alibaba:druid:1.2.28'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.11'

    // for mongodb
    implementation 'org.mongodb:mongodb-driver-sync:5.8.0'

    // for websocket
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    // for log4j2
    implementation 'com.lmax:disruptor:4.0.0'

    // for rocketMQ
    implementation('org.apache.rocketmq:rocketmq-client:4.9.8') {
        exclude group: 'io.netty', module: 'netty-all'
    }
    implementation 'javax:javaee-api:8.0.1'

    // for task component
    implementation 'org.jgrapht:jgrapht-core:1.5.3'

    // for new Compress/Decompress Codec in Zeze.Net
    implementation 'com.github.luben:zstd-jni:1.5.7-7'

    implementation 'org.freemarker:freemarker:2.3.34'
    implementation 'org.thymeleaf:thymeleaf:3.1.4.RELEASE'
    // implementation 'com.github.marianobarrios:tls-channel:0.9.1'
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ["--add-exports", "java.base/sun.security.x509=ALL-UNNAMED"]
}

// 测试代码（src 与 Gen 互相引用，一起挂在 test 源集）。
// src 里只有测试，没有 main 代码；依赖保持 implementation（test 源集可见）。
sourceSets {
    test {
        java {
            srcDirs = ['src', 'Gen']
        }
    }
}

// gradle test：只跑自包含测试（@Fast / @Tag("fast")），不依赖任何外部进程。
tasks.named('test', Test) {
    useJUnitPlatform {
        includeTags 'fast'
    }
    workingDir = projectDir
    jvmArgs '-ea'
    // @Fast 自包含测试不需要 SM/Global 环境，关闭 TestEnvLauncherListener 的进程内启动
    systemProperty 'zeze.test.env', 'off'
    // 类级并行（方法保持同线程），墙钟 ~24s→~10s。仅限 test 任务：
    // integrationTest/bench 绝不并行（demo.App 单例、共享 dbhome、端口互踩）。
    // 代价：@Fast 准入要求"彼此互不干扰"（固定端口独占、本地目录独占、无静态状态竞争），见 AGENTS.md。
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
}

// gradle integrationTest：全量功能测试（含依赖 SM 5001/Global 5002 的 A/B 类），不含 @Bench 吞吐基准。
// 排序必须 mustRunAfter（家族全链见 bench 处注释）：org.gradle.parallel=true 下 shouldRunAfter 软序
// 被 Gradle 忽略——2026-09-30 实证 `test integrationTest bench` 一条命令三相并发 fork，test worker
// 与 IT worker 跨 JVM 互踩 zeze_cache_0.lock（FileMutex 报 "another process"）与 Dbh2 11000/7788
// 端口，IT 相 135/238 级联假红（共享 demo.App 卡 eStarting）。
tasks.register('integrationTest', Test) {
    group = 'verification'
    description = '全量功能测试（不含 @Bench 吞吐基准），需要（或自动创建）SM(5001)/Global(5002) 环境。'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'bench','fast'
    }
    workingDir = projectDir
    jvmArgs '-ea'
    mustRunAfter tasks.named('test')
}

// gradle bench：吞吐基准（@Bench 标注，Benchmark 包整体）。基准靠打印 M/s 观察，不设断言；
// 其中 A/B/C 事务场景依赖 SM/Global（进程内 harness 自动提供，不设 zeze.test.env=off）。
// 家族全链硬序（test→integrationTest→bench→benchCore→benchCorePlatform）：四测试任务共享
// demo.App 单例/dbhome/固定端口，任意子集同图调用都必须串行——只对 test 排序时 IT 与 bench
// 之间零约束（首事故 bench 14:51-14:53 落在 IT 窗口内）。mustRunAfter 不产生依赖，单独调用
// 任一任务不会拉起前序任务，语义与原 shouldRunAfter 兼容。
tasks.register('bench', Test) {
    group = 'verification'
    description = '吞吐基准（@Bench 标注）。'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bench'
    }
    workingDir = projectDir
    jvmArgs '-ea'
    mustRunAfter tasks.named('test'), tasks.named('integrationTest')
}

// gradle benchCore：核心宏观基准（@Bench + @Tag("core")，6 场景：A/B/C/D/E/F）。
// 与 bench 的区别：多轮迭代+JSON 留档（harness.MacroBench 写 bench-results/<benchTag>/），
// 供优化循环做 before/after 机器对比（benchTag 命名本次运行：-PbenchTag=baseline）。
// 同 bench 依赖进程内 SM/Global；绝不并行（与 bench 同因）。
tasks.register('benchCore', Test) {
    group = 'verification'
    description = '核心宏观基准（多轮+JSON 留档，-PbenchTag=xxx 命名运行）。'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bench & core'
    }
    workingDir = projectDir
    jvmArgs '-ea'
    systemProperty 'bench.tag', (findProperty('benchTag') ?: 'adhoc')
    // 池型对照透传：-PuseVirtualThread=false 走平台线程池（对齐 benchCorePlatform，可全场景）
    if (findProperty('useVirtualThread') != null)
        systemProperty 'useVirtualThread', findProperty('useVirtualThread')
    // 场景类字母序执行（A→B→C→D→E2→E→F）：E/E2 的 Stop+Start(custom cfg) 切换库配置，
    // 固定顺序避免 F 落在 E 之后继承非默认配置（虽然各场景开场已自带 Stop+Start，此为双保险）。
    systemProperty 'junit.jupiter.testclass.order.default', 'org.junit.jupiter.api.ClassOrderer$ClassName'
    mustRunAfter tasks.named('test'), tasks.named('integrationTest'), tasks.named('bench')
}

// gradle benchCorePlatform：benchCore 的平台线程池对照组（-DuseVirtualThread=false），
// 仅跑 F 调度形态场景（F 类记录 virtualThread 标志进 JSON，两目录同文件名可直接对比）。
tasks.register('benchCorePlatform', Test) {
    group = 'verification'
    description = '核心基准平台线程对照组（仅 F 调度场景，-DuseVirtualThread=false）。'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bench & core'
    }
    filter.includeTestsMatching '*FDispatch*'
    workingDir = projectDir
    jvmArgs '-ea'
    systemProperty 'bench.tag', (findProperty('benchTag') ?: 'adhoc')
    systemProperty 'junit.jupiter.testclass.order.default', 'org.junit.jupiter.api.ClassOrderer$ClassName'
    systemProperty 'useVirtualThread', 'false'
    mustRunAfter tasks.named('test'), tasks.named('integrationTest'), tasks.named('bench'), tasks.named('benchCore')
}

// JMH 微基准源集：编译依赖 test 源集输出（demo/Gen 生成的 bean 与表）+ test 编译类路径。
// 手动源集而非 me.champeau.jmh 插件：gradle 9.7 兼容性未验证，且仓库镜像源不含 gradle 插件门户。
// 源码放 src-jmh（对齐 src-hot 先例）：test 源集 srcDirs=['src'] 递归包含子目录，放 src/ 下会被 test 编译误收。
sourceSets {
    jmh {
        java.srcDir 'src-jmh'
        compileClasspath += sourceSets.test.output + sourceSets.test.compileClasspath
        runtimeClasspath += sourceSets.test.output + sourceSets.test.runtimeClasspath
    }
}

dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

// gradle jmh：JMH 微基准（src/jmh）。参数透传（均有默认）：
//   -PjmhFilter=正则（默认 .*） -PjmhFork=1 -PjmhWi=5 -PjmhI=5 -PjmhW=1s -PjmhR=1s -PbenchTag=adhoc
// JSON 结果写 bench-results/jmh-<benchTag>.json（一次运行一个文件，JMH 自身格式）。
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'JMH 微基准（src/jmh，JSON 留档）。'
    mainClass = 'org.openjdk.jmh.Main'
    classpath = sourceSets.jmh.runtimeClasspath
    workingDir = projectDir
    def tag = findProperty('benchTag') ?: 'adhoc'
    args (findProperty('jmhFilter') ?: '.*'),
            '-f', findProperty('jmhFork') ?: '1',
            '-wi', findProperty('jmhWi') ?: '5',
            '-i', findProperty('jmhI') ?: '5',
            '-w', findProperty('jmhW') ?: '1s',
            '-r', findProperty('jmhR') ?: '1s',
            '-foe', 'true',
            '-rf', 'json',
            '-rff', "bench-results/jmh-${tag}.json"
    if (findProperty('jmhJvmArgsAppend') != null)
        args '-jvmArgsAppend', findProperty('jmhJvmArgsAppend')
    if (findProperty('jmhExtraArgs') != null)
        args findProperty('jmhExtraArgs').toString().split(' ') as List
    jvmArgs '-Xms2g', '-Xmx2g'
}

// 测试运行残留收尾清理：finalizedBy 在测试 JVM 退出后运行（Windows 下被打开的文件删不掉，
// 此刻必已释放），测试失败/UP-TO-DATE 也会执行；IDEA 直跑不经 gradle，不覆盖。
// 清理项（全部为 gitignored 的运行时产物，测试按需重建）：
// - zeze_cache_*.lock：FileMutex 设计上释放后不删除（删除与后续获取者竞态，见其
//   javadoc），动态发号测试族累积的 0 字节锁文件；
// - *.zeze.pal / CommitOnzServer*/ / *.raft/ / testMmapFile* / hs_err_pid*.log：cwd 下的
//   每次运行产物，测试开头先删后开，无事后取证价值；
// - log/ 内 7 天前的滚动日志（zeze_error.* 101MB/天）：近 7 天保留失败取证；根治需动
//   生产共享的 log4j2.xml 保留策略，不在本任务射程。
// 不清理：zeze_cache_*/ 目录（Application.start 先删后开已自洽，rocksdb 数据有取证价值）、
// lib/（运行时依赖 jar）、test.ks（SSL 测试密钥库）。
// 配置缓存兼容：projectDir 在配置期捕获为File，执行期不触碰脚本项目方法。
def residueDir = projectDir
def logCutoffMs = 7L * 24 * 3600 * 1000
def cleanTestResidue = tasks.register('cleanTestResidue') {
    doLast {
        int locks = 0, files = 0, dirs = 0, staleLogs = 0
        residueDir.listFiles()?.each { f ->
            if (f.isFile()) {
                if (f.name.startsWith('zeze_cache_') && f.name.endsWith('.lock')) {
                    if (f.delete()) locks++
                } else if (f.name.endsWith('.zeze.pal') || f.name.startsWith('hs_err_pid')
                        || f.name.startsWith('testMmapFile')) {
                    if (f.delete()) files++
                }
            } else if (f.isDirectory() && (f.name.startsWith('CommitOnzServer') || f.name.endsWith('.raft'))) {
                if (f.deleteDir()) dirs++
            }
        }
        def logDir = new File(residueDir, 'log')
        def cutoff = System.currentTimeMillis() - logCutoffMs
        logDir.listFiles()?.each { f ->
            if (f.isFile() && f.lastModified() < cutoff && f.delete())
                staleLogs++
        }
        if (locks + files + dirs + staleLogs > 0)
            logger.lifecycle("cleaned {} lock(s), {} residue file(s), {} residue dir(s), {} stale log(s)",
                    locks, files, dirs, staleLogs)
    }
}
tasks.withType(Test).configureEach {
    finalizedBy cleanTestResidue
    // BenchSocket 等测试分配大 ByteBuffer，默认 512m 堆会 OOM；对齐 IDEA 运行时的大堆
    maxHeapSize = '2g'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
