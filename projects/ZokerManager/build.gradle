plugins {
    id 'java'
}

group = 'com.zezeno'
version = '2.0.3-SNAPSHOT'

repositories {
    maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
    maven { url = 'https://maven.aliyun.com/nexus/content/groups/public/' }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    options.encoding = 'utf-8'
    options.incremental = true
    options.failOnError = true
    options.debugOptions.debugLevel = "source,lines,vars"
    options.compilerArgs += "-parameters"
}

dependencies {
    // 同仓 ZezeJava 源码级消费：settings.gradle 的 includeBuild 将本坐标替换为其 :ZezeJava 子工程
    // （随 HEAD 同步编译，不走 maven 产物）。ZezeJava 侧 netty/log4j 多为 compileOnly，
    // 本模块源码直接引用的类型在此显式声明（自带版本对齐）。
    implementation 'com.zezeno:zeze-java:2.0.3-SNAPSHOT'

    // for netty
    implementation 'io.netty:netty-codec-http:4.1.137.Final'
    implementation 'io.netty:netty-transport-native-epoll:4.1.137.Final:linux-x86_64'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'

    // @NotNull/@Nullable 标记（ZezeJava 侧为 implementation，跨构建不透传，此处自带）
    compileOnly 'org.jetbrains:annotations:26.1.0'

    // for test (JUnit 6 / Jupiter；fastjson2 为随迁用例的 JSON 断言依赖，版本对齐 ZezeJavaTest)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testImplementation 'com.alibaba.fastjson2:fastjson2:2.0.65'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

test {
    useJUnitPlatform()
    jvmArgs '-ea'
}

tasks.register('clearJar', Delete) {
    delete 'lib'
}

tasks.register('copyJar', Sync) {
    from configurations.runtimeClasspath
    into 'lib'
}
